name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck skills/*/scripts/*.sh tests/*.sh
      - name: Shellcheck the model policy commands
        run: >-
          shellcheck skills/gd-model-policy/scripts/*
          skills/gd-model-policy/adapters/claude/hooks/*
      - name: Structure checks
        run: bash tests/check-structure.sh
      - name: Integration tests
        run: bash tests/gd-mysql-branch.test.sh
      - name: Model policy tests
        run: |
          bash tests/gd-model-policy.test.sh
          bash tests/gd-model-policy-claude.test.sh
      - name: Orchestrate-ticket tests
        run: bash tests/gd-orchestrate-ticket.test.sh

  model-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
